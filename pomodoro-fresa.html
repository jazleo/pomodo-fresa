<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro 🍓</title>
<style>
  :root{
    --pink:#f8d7e0; --pink-deep:#e8899f; --red:#d8474d; --red-dk:#b8353c;
    --cream:#fdf1e6; --ink:#4a2c2c; --green:#7a9b6e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Georgia', 'Times New Roman', serif;
    background:linear-gradient(160deg,var(--pink) 0%,#fbe7ea 60%,var(--cream) 100%);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));
    min-height:100%;
  }
  .card{
    background:#fffdfb;
    border:3px solid var(--pink-deep);
    border-radius:28px;
    padding:28px 26px 24px;
    width:100%; max-width:340px;
    text-align:center;
    box-shadow:0 10px 30px rgba(180,90,100,0.18);
  }
  .title{
    font-size:1.05rem; font-weight:bold; letter-spacing:.5px;
    color:var(--red-dk); margin:0 0 4px;
  }
  .subtitle{
    font-size:.78rem; color:var(--pink-deep); margin:0 0 18px; font-style:italic;
  }
  .modes{
    display:flex; gap:8px; justify-content:center; margin-bottom:18px;
  }
  .mode-btn{
    border:2px solid var(--pink-deep); background:var(--pink);
    color:var(--red-dk); border-radius:999px; padding:6px 14px;
    font-size:.72rem; font-family:inherit; cursor:pointer; font-weight:bold;
  }
  .mode-btn.active{ background:var(--red); color:#fff; border-color:var(--red-dk); }

  .ring-wrap{ position:relative; width:220px; height:220px; margin:0 auto 18px; }
  svg{ transform:rotate(-90deg); width:100%; height:100%; }
  .ring-bg{ fill:none; stroke:#f3d8dc; stroke-width:14; }
  .ring-fg{ fill:none; stroke:var(--red); stroke-width:14; stroke-linecap:round;
    transition:stroke-dashoffset 0.3s linear; }
  .time-label{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .time{ font-size:2.6rem; font-weight:bold; color:var(--ink); line-height:1; }
  .phase{ font-size:.72rem; color:var(--pink-deep); margin-top:6px; letter-spacing:1px; text-transform:uppercase; }

  .controls{ display:flex; gap:10px; justify-content:center; margin-bottom:14px; }
  button.action{
    font-family:inherit; font-size:.85rem; font-weight:bold;
    border:none; border-radius:14px; padding:10px 20px; cursor:pointer;
  }
  #startPause{ background:var(--red); color:#fff; }
  #startPause:active{ background:var(--red-dk); }
  #reset{ background:var(--pink); color:var(--red-dk); }
  #reset:active{ background:var(--pink-deep); color:#fff; }

  .sessions{ font-size:.75rem; color:var(--green); }
  .berry{ font-size:1rem; letter-spacing:2px; }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#2b1e1e;
    }
    body:not([data-theme]){ background:linear-gradient(160deg,#3a2530,#2b1e1e); }
  }
</style>
</head>
<body>
  <div class="card">
    <p class="title">🍓 Pomodoro</p>
    <p class="subtitle">Para concentrarme (o al menos fingir que lo intento) 🍓</p>

    <div class="modes">
      <button class="mode-btn active" data-min="25" data-phase="Enfoque">Enfoque 25</button>
      <button class="mode-btn" data-min="5" data-phase="Descanso corto">Descanso 5</button>
      <button class="mode-btn" data-min="15" data-phase="Descanso largo">Descanso 15</button>
    </div>

    <div class="ring-wrap">
      <svg viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="96"></circle>
        <circle id="ringFg" class="ring-fg" cx="110" cy="110" r="96"></circle>
      </svg>
      <div class="time-label">
        <div id="time" class="time">25:00</div>
        <div id="phase" class="phase">Enfoque</div>
      </div>
    </div>

    <div class="controls">
      <button id="startPause" class="action">Iniciar</button>
      <button id="reset" class="action">Reiniciar</button>
    </div>

    <div class="sessions">
      <span class="berry" id="berries">🍓</span><br>
      <span id="sessionCount">0 sesiones completadas hoy</span>
    </div>
  </div>

<script>
  const CIRC = 2 * Math.PI * 96;
  const ringFg = document.getElementById('ringFg');
  ringFg.style.strokeDasharray = CIRC;
  ringFg.style.strokeDashoffset = 0;

  const timeEl = document.getElementById('time');
  const phaseEl = document.getElementById('phase');
  const startPauseBtn = document.getElementById('startPause');
  const resetBtn = document.getElementById('reset');
  const berriesEl = document.getElementById('berries');
  const sessionCountEl = document.getElementById('sessionCount');
  const modeBtns = document.querySelectorAll('.mode-btn');

  let totalSeconds = 25 * 60;
  let remaining = totalSeconds;
  let running = false;
  let intervalId = null;
  let currentPhase = 'Enfoque';
  let completed = 0;

  try {
    const saved = localStorage.getItem('pomodoro_completed_v1');
    if (saved) completed = parseInt(saved, 10) || 0;
  } catch(e) {}
  updateSessionLabel();

  function updateSessionLabel(){
    sessionCountEl.textContent = completed + (completed === 1 ? ' sesión completada hoy' : ' sesiones completadas hoy');
    berriesEl.textContent = '🍓'.repeat(Math.min(completed, 8)) || '🍓';
  }

  function render(){
    const m = Math.floor(remaining / 60).toString().padStart(2,'0');
    const s = Math.floor(remaining % 60).toString().padStart(2,'0');
    timeEl.textContent = m + ':' + s;
    const progress = 1 - (remaining / totalSeconds);
    ringFg.style.strokeDashoffset = CIRC * progress;
  }

  function tick(){
    if (remaining <= 0){
      running = false;
      clearInterval(intervalId);
      startPauseBtn.textContent = 'Iniciar';
      if (currentPhase === 'Enfoque'){
        completed += 1;
        try { localStorage.setItem('pomodoro_completed_v1', String(completed)); } catch(e) {}
        updateSessionLabel();
      }
      try {
        if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(200);
      } catch(e) {}
      return;
    }
    remaining -= 1;
    render();
  }

  startPauseBtn.addEventListener('click', () => {
    if (running){
      running = false;
      clearInterval(intervalId);
      startPauseBtn.textContent = 'Iniciar';
    } else {
      running = true;
      startPauseBtn.textContent = 'Pausar';
      intervalId = setInterval(tick, 1000);
    }
  });

  resetBtn.addEventListener('click', () => {
    running = false;
    clearInterval(intervalId);
    remaining = totalSeconds;
    startPauseBtn.textContent = 'Iniciar';
    render();
  });

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      modeBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      running = false;
      clearInterval(intervalId);
      startPauseBtn.textContent = 'Iniciar';
      totalSeconds = parseInt(btn.dataset.min, 10) * 60;
      remaining = totalSeconds;
      currentPhase = btn.dataset.phase;
      phaseEl.textContent = currentPhase;
      render();
    });
  });

  render();
</script>
</body>
</html>
